# INACTIVE REVIEW DRAFT. Not installed in .github/workflows.
# Requires Kyle's final go, Pages Actions mode, and protected environment.
name: Publish Approved Dashboard Bundle
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Immutable private Release asset ID
        required: true
      bundle_sha256:
        description: Reviewed local bundle SHA-256
        required: true
      approval:
        description: Type PUBLISH APPROVED BUNS
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.approval == 'PUBLISH APPROVED BUNS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download approved private asset
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_RELEASE_READ_TOKEN }}
          ASSET_ID: ${{ inputs.asset_id }}
          EXPECTED_SHA: ${{ inputs.bundle_sha256 }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/KyleDawson24/fantasy-league-almanac-dev/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/dashboard.zip"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/dashboard.zip" | sha256sum --check
      - name: Preserve portfolio and compose reviewed payload
        env:
          EXPECTED_SHA: ${{ inputs.bundle_sha256 }}
        run: |
          python publication-tools/compose_site.py --bundle "$RUNNER_TEMP/dashboard.zip" --sha256 "$EXPECTED_SHA" --portfolio . --baseline publication-tools/homepage-baseline.json --out "$RUNNER_TEMP/site" --release
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
